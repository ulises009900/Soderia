<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seleccionar Vista - Sodería</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/extra-style.css">
    <link rel="stylesheet" href="/css/enhancements.css">
</head>
<body>
    <div class="selector-container">
        <div style="text-align: center; margin-bottom: 2rem;">
            <h1 style="font-size: 2.5rem; margin: 0 0 0.5rem 0;"> Sodería</h1>
            <p style="color: #999; font-size: 0.95rem; margin: 0;">Sistema de Gestión Integral</p>
        </div>
        
        <h2>Bienvenido, admin</h2>
        <p style="color: var(--text-light); margin-bottom: 2rem;">Selecciona el modo de operación:</p>
        
        <div class="button-group">
            <a href="/dashboard" class="btn" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
                <span style="font-size: 1.5rem;">📊</span><br>
                <strong>Contabilidad</strong>
            </a>
            <a href="/admin" class="btn" style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);">
                <span style="font-size: 1.5rem;">⚙️</span><br>
                <strong>Administración</strong>
            </a>
            <a href="/pc" class="btn" style="background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);">
                <span style="font-size: 1.5rem;">💻</span><br>
                <strong>Gestión de Ventas</strong>
            </a>
            <a href="/movil" class="btn" style="background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);">
                <span style="font-size: 1.5rem;">📱</span><br>
                <strong>Carga Móvil</strong>
            </a>
        </div>
        
        <a href="/logout" class="logout-link" style="margin-top: 2rem;">🔓 Cerrar Sesión</a>
    </div>
</body>
</html>
