<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sodería</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/extra-style.css">
    <link rel="stylesheet" href="/css/enhancements.css">
</head>
<body>
    <div class="login-container">
        <div style="text-align: center; margin-bottom: 2rem;">
            <h1 style="font-size: 2.5rem; margin: 0 0 0.5rem 0;">Sodería</h1>
            <p style="color: #999; font-size: 0.95rem; margin: 0;">Sistema de Gestión</p>
        </div>
        
        <h2>Iniciar Sesión</h2>
        <form action="/login" method="post">
            <div class="input-group">
                <label for="username">Usuario</label>
                <input type="text" name="username" id="username" placeholder="Ingresa tu usuario" required>
            </div>
            <div class="input-group">
                <label for="password">Contraseña</label>
                <input type="password" name="password" id="password" placeholder="Ingresa tu contraseña" required>
            </div>
            <button type="submit" style="width: 100%; padding: 0.75rem; font-size: 1.1rem; margin-top: 1.5rem;">🔓 Entrar</button>
        </form>
        
        <p style="color: #999; font-size: 0.9rem; margin-top: 2rem; text-align: center;">© 2026 Sodería - Todos los derechos reservados</p>
    </div>
</body>
</html>
