<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Gestión - Soderia</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="desktop-container">
    <header>
      <h1>🖥️ Panel de Gestión</h1>
      <div class="header-controls">
        <input type="text" id="username" placeholder="Tu nombre" maxlength="20">
        <span id="status" class="status disconnected">Desconectado</span>
        <span id="userCount" class="user-count">Usuarios: 0</span>
      </div>
    </header>

    <main>
      <!-- Panel de Control -->
      <aside class="sidebar">
        <h3>Opciones</h3>
        <button id="refreshBtn" class="btn btn-secondary full-width">🔄 Actualizar</button>
        <button id="clearAllBtn" class="btn btn-danger full-width" style="margin-top: 10px;">🗑️ Limpiar Todo</button>
        
        <hr>
        
        <h3>Filtros</h3>
        <select id="filterType" class="full-width">
          <option value="all">Todos los tipos</option>
          <option value="text">📝 Texto</option>
          <option value="command">⚙️ Comando</option>
          <option value="location">📍 Ubicación</option>
          <option value="image">🖼️ Imagen</option>
        </select>
        
        <select id="filterUser" class="full-width" style="margin-top: 10px;">
          <option value="all">Todos los usuarios</option>
        </select>

        <h3>Usuarios Conectados</h3>
        <div id="usersList" class="users-list">
          <p class="empty-state">Sin usuarios conectados</p>
        </div>
      </aside>

      <!-- Vista Principal -->
      <section class="main-content">
        <!-- Estadísticas -->
        <div class="stats-container">
          <div class="stat-card">
            <span class="stat-label">Total Datos</span>
            <span id="totalCount" class="stat-value">0</span>
          </div>
          <div class="stat-card">
            <span class="stat-label">Hoy</span>
            <span id="todayCount" class="stat-value">0</span>
          </div>
          <div class="stat-card">
            <span class="stat-label">Usuarios Activos</span>
            <span id="activeUsers" class="stat-value">0</span>
          </div>
        </div>

        <!-- Lista de Datos -->
        <div class="data-container">
          <h2>Datos Recibidos</h2>
          <div id="dataList" class="data-list">
            <p class="empty-state">Cargando datos...</p>
          </div>
        </div>
      </section>
    </main>

    <dialog id="detailsModal" class="modal">
      <div class="modal-content">
        <span class="close">&times;</span>
        <h2 id="detailsTitle">Detalles</h2>
        <div id="detailsBody"></div>
        <div class="modal-actions">
          <button id="editBtn" class="btn btn-primary">✏️ Editar</button>
          <button id="deleteBtn" class="btn btn-danger">🗑️ Eliminar</button>
          <button onclick="document.getElementById('detailsModal').close()" class="btn">Cerrar</button>
        </div>
      </div>
    </dialog>

    <!-- Notificaciones -->
    <div id="notification" class="notification"></div>

    <footer>
      <button onclick="window.location.href='/'">← Volver</button>
    </footer>
  </div>

  <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
  <script src="js/desktop.js"></script>
</body>
</html>
